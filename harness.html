<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroCat Harness</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        min-height: 100%;
        background: #ffffff;
        color: #1a1d23;
        font: 13px/1.5 "Segoe UI", "PingFang SC", system-ui, sans-serif;
        overflow-x: hidden;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 16px 14px 28px;
      }
      #pet-canvas {
        display: block;
        touch-action: none;
        user-select: none;
        border-radius: 14px;
        background: transparent;
      }
      #panel {
        width: min(880px, 100%);
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(22, 27, 36, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .row > label {
        min-width: 52px;
        font-size: 11.5px;
        color: #9aa4b2;
        flex: none;
      }
      #panel strong { font-size: 14px; color: #d2f244; }
      .status { font-size: 11.5px; color: #7ee8a6; }
      button {
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.05);
        color: #dfe4ea;
        border-radius: 7px;
        padding: 4px 9px;
        font-size: 11.5px;
        cursor: pointer;
        transition: background 0.13s ease, border-color 0.13s ease, color 0.13s ease;
        font-family: inherit;
      }
      button:hover { background: rgba(255, 255, 255, 0.12); }
      button.active {
        background: #d2f244;
        border-color: #d2f244;
        color: #14161a;
        font-weight: 600;
      }
      button.swatch {
        width: 20px;
        height: 20px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.22);
      }
      button.swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 150px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        outline: none;
        cursor: pointer;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #d2f244;
        border: 2px solid #181a20;
      }
      .val { font-size: 11px; color: #9aa4b2; min-width: 38px; }
      .hint { font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="pet-canvas"></canvas>
      <div id="panel"></div>
      <div class="hint">提示：直接敲键盘 → 对应按键亮起；点鼠标左右键 → 高亮；鼠标划过猫头来回摸 → 眯眼呼噜；<b>点右侧饮品 → 伸手喝一口并喷出粒子特效</b>；面板可切配列 / 外观 / 灯光 / 键帽 DIY / 道具</div>
    </div>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
