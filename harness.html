<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIY-Cat 模型交互预览</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        min-height: 100%;
        background: #ffffff;
        color: #1a1d23;
        font: 13px/1.5 "Segoe UI", "PingFang SC", system-ui, sans-serif;
        overflow-x: hidden;
      }
      #stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 16px 14px 28px;
      }
      .preview-heading { width: min(1120px, 100%); }
      .preview-heading h1 { font-size: 22px; font-weight: 650; letter-spacing: -.5px; }
      .preview-heading p { color: #66624f; margin-top: 5px; }
      #preview-comparison { width: min(1120px,100%); display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; align-items: center; }
      #preview-comparison.has-reference { grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); }
      #live-preview { min-width: 0; display: flex; justify-content: center; border-radius: 18px; background: #faf9f5; }
      #naiwa-reference img { display:block; width:100%; height:auto; border-radius:12px; }
      #naiwa-reference a { display:block; border-radius:12px; }
      #naiwa-reference a:focus-visible { outline: 2px solid #857433; outline-offset: 4px; }
      #naiwa-reference figcaption { margin-top:8px; color:#696554; font-size:12px; }
      @media (max-width: 820px) { #preview-comparison.has-reference { grid-template-columns: minmax(0,1fr); } }
      #pet-canvas {
        display: block;
        touch-action: none;
        user-select: none;
        border-radius: 14px;
        background: transparent;
      }
      #panel {
        width: min(880px, 100%);
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding: 12px 14px;
        border-radius: 12px;
        background: rgba(22, 27, 36, 0.92);
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .row > label {
        min-width: 52px;
        font-size: 11.5px;
        color: #9aa4b2;
        flex: none;
      }
      #panel strong { font-size: 14px; color: #d2f244; }
      .status { font-size: 11.5px; color: #7ee8a6; }
      button {
        border: 1px solid rgba(255, 255, 255, 0.13);
        background: rgba(255, 255, 255, 0.05);
        color: #dfe4ea;
        border-radius: 7px;
        padding: 4px 9px;
        font-size: 11.5px;
        cursor: pointer;
        transition: background 0.13s ease, border-color 0.13s ease, color 0.13s ease;
        font-family: inherit;
      }
      [hidden] { display: none !important; }
      button:focus-visible, input:focus-visible { outline: 2px solid #d2f244; outline-offset: 3px; }
      #panel ::selection { background: #d2f244; color: #14161a; }
      input[type="checkbox"] { accent-color: #d2f244; }
      #cats { display: flex; flex-wrap: wrap; gap: 4px; }
      .hint { max-width: 80ch; }
      @media (prefers-reduced-motion: reduce) { button { transition: none; } }
      button:hover { background: rgba(255, 255, 255, 0.12); }
      button.active {
        background: #d2f244;
        border-color: #d2f244;
        color: #14161a;
        font-weight: 600;
      }
      button.swatch {
        width: 20px;
        height: 20px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.22);
      }
      button.swatch.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,0.35); }
      input[type='range'] {
        -webkit-appearance: none;
        appearance: none;
        width: 150px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        outline: none;
        cursor: pointer;
      }
      input[type='range']::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #d2f244;
        border: 2px solid #181a20;
      }
      .val { font-size: 11px; color: #9aa4b2; min-width: 38px; }
      .hint { font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="stage">
      <header class="preview-heading"><h1>模型交互预览</h1><p id="preview-intro">直接敲键盘、点击鼠标，或选择下方动作查看互动。</p></header>
      <section id="preview-comparison" aria-label="模型与参考图对照">
        <div id="live-preview"><canvas id="pet-canvas" aria-label="可互动的桌宠模型"></canvas></div>
        <figure id="naiwa-reference" hidden>
          <a id="reference-link" target="_blank" rel="noopener" aria-label="在新标签页查看奶蛙完整参考图"><img id="reference-image" width="1152" height="768" alt="奶蛙正面、侧面、背面、趴姿及开心、害羞、惊讶、疲倦等表情设计图" /></a>
          <figcaption>你的设计图 · 点击放大。左侧使用实际桌宠引擎，可检查轮廓、手脚衔接和动作。</figcaption>
        </figure>
      </section>
      <div id="panel"></div>
      <div class="hint">提示：直接敲键盘 → 对应按键亮起；点鼠标左右键 → 高亮；抚摸头部 → 眯眼与爱心，猫咪可呼噜（奶蛙无专属音效）；<b>点击饮品 → 前手拿起使用并触发反应</b>；奶蛙坐着用双手操作键鼠，可左右晃身、好奇探头和交替摆脚，只替代配置中的尾巴按键；<b>“趴键盘睡觉”后敲键可查看连续起身与跺脚反应，“嘴边鼓腮”可查看生气表情</b>；面板可切配列 / 外观 / 灯光 / 键帽 DIY / 道具</div>
    </div>
    <script type="module" src="/src/harness.ts"></script>
  </body>
</html>
