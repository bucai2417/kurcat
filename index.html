<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KuroCat</title>
  </head>
  <body>
    <canvas id="pet-canvas"></canvas>
    <canvas id="pet-canvas-3d" class="hidden"></canvas>

    <div id="update-toast" class="update-toast hidden" role="status" aria-live="polite">
      <span class="update-toast-text" id="update-toast-text">✨ 发现新版本</span>
      <button class="update-toast-btn hidden" id="btn-toast-install" type="button">立即更新</button>
      <button class="update-toast-btn secondary hidden" id="btn-toast-open" type="button">发布页</button>
      <button class="update-toast-close" id="btn-toast-close" type="button" title="稍后提醒">×</button>
    </div>

    <div id="context-menu" class="context-menu hidden tabbed">
      <div class="menu-header-row">
        <div class="menu-header" id="menu-header">🐈‍⬛ KuroCat 小黑猫</div>
        <button class="menu-close-btn" id="btn-close-menu" type="button" title="关闭 (Esc)">×</button>
      </div>
      <div class="menu-tabs" role="tablist">
        <button class="menu-tab-btn active" data-tab="appearance" type="button" role="tab">🐱 外观与互动</button>
        <button class="menu-tab-btn" data-tab="system" type="button" role="tab">⚙️ 键盘·系统</button>
      </div>
      <div class="tab-body">
      <div class="tab-panel active" data-tab-panel="appearance">
      <div class="menu-scale-row">
        <span class="menu-scale-label">角色外观（支持 MCP 定制）</span>
        <div class="breed-pills" id="breed-pills">
          <button class="breed-pill active" data-breed="black">🐈‍⬛ 小黑猫</button>
          <button class="breed-pill" data-breed="ragdoll">🐱 布偶猫</button>
          <button class="breed-pill" data-breed="dafeiyu">🐳 大肥鱼</button>
        </div>
      </div>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="toggle-privacy" title="检测到输入密码时猫猫自动闭眼、大肥鱼双手捂眼并隐藏全部按键">
        <span>输密码自动闭眼防偷窥</span>
        <span class="menu-check" id="chk-privacy">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-bubbles">
        <span>悬浮按键气泡</span>
        <span class="menu-check" id="chk-bubbles">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-lock" title="开启后按住 Alt 键仍可拖动或右键解锁">
        <span>锁定鼠标穿透（Alt 解锁）</span>
        <span class="menu-check" id="chk-lock"></span>
      </button>
      <button class="menu-item" data-action="toggle-sound">
        <span>摸头呼噜声</span>
        <span class="menu-check" id="chk-sound">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-top">
        <span>始终置顶显示</span>
        <span class="menu-check" id="chk-top">✓</span>
      </button>
      <button class="menu-item" data-action="toggle-autostart">
        <span>开机自动启动</span>
        <span class="menu-check" id="chk-autostart"></span>
      </button>
      <div class="menu-sep"></div>
      <button class="menu-item" data-action="toggle-mcp">
        <span>开启 MCP 扩展</span>
        <span class="menu-check" id="chk-mcp">✓</span>
      </button>
      <button class="menu-item" data-action="copy-mcp" id="btn-copy-mcp">
        <span>复制 MCP 配置</span>
        <span class="menu-hint" id="mcp-copy-hint">AI 捏猫</span>
      </button>
      <div class="menu-sep"></div>
      <div class="menu-scale-row" id="render-mode-row">
        <span class="menu-scale-label">视觉模式</span>
        <div class="kb-pills">
          <button class="kb-pill active" data-rendermode="2d">2D 手绘</button>
          <button class="kb-pill" data-rendermode="3d">3D 实时</button>
        </div>
        <div class="kb-pills" id="collar-row">
          <button class="kb-pill active" data-collar="none">无项圈</button>
          <button class="kb-pill" data-collar="red">红铃铛</button>
          <button class="kb-pill" data-collar="blue">蓝铃铛</button>
          <button class="kb-pill" data-collar="pink">粉铃铛</button>
        </div>
        <div class="kb-pills" id="headphone-row">
          <button class="kb-pill active" data-headphone="off">无耳机</button>
          <button class="kb-pill" data-headphone="auto">游戏时戴</button>
          <button class="kb-pill" data-headphone="on">常戴</button>
        </div>
      </div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">尾巴拍键</span>
        <div class="kb-pills" id="tail-mode-pills">
          <button class="kb-pill active" data-tailmode="smart">智能（右侧）</button>
          <button class="kb-pill" data-tailmode="edge">外侧功能键</button>
          <button class="kb-pill" data-tailmode="off">关闭</button>
        </div>
      </div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">OBS 直播源</span>
        <div class="kb-pills" id="obs-pills">
          <button class="kb-pill" data-obstoggle="on">开启</button>
          <button class="kb-pill active" data-obstoggle="off">关闭</button>
        </div>
        <button class="menu-item" id="btn-copy-obs-url">
          <span>复制 OBS 浏览器源地址</span>
          <span class="menu-hint" id="obs-url-hint">未开启</span>
        </button>
      </div>
      </div><!-- /appearance -->
      <div class="tab-panel" data-tab-panel="system">
      <div class="menu-scale-row">
        <span class="menu-scale-label">键盘配列与方向</span>
        <div class="kb-pills">
          <button class="kb-pill active" data-kblayout="65">65% 紧凑</button>
          <button class="kb-pill" data-kblayout="108">108 全尺寸</button>
        </div>
        <div class="kb-pills">
          <button class="kb-pill active" data-kborient="cat">面向猫咪</button>
          <button class="kb-pill" data-kborient="viewer">面向观众</button>
        </div>
        <div class="kb-pills" id="mouse-orient-pills">
          <button class="kb-pill active" data-mouseorient="auto">鼠标·跟随键盘</button>
          <button class="kb-pill" data-mouseorient="cat">鼠标·面向猫咪</button>
          <button class="kb-pill" data-mouseorient="viewer">鼠标·面向观众</button>
        </div>
      </div>
      <div class="menu-scale-row">
        <div class="scale-header">
          <span class="menu-scale-label">键盘尺寸</span>
          <button class="scale-value-btn" id="kb-scale-value" type="button" title="点击复位默认">85%</button>
        </div>
        <div class="scale-slider-wrap">
          <input
            type="range"
            id="kb-scale-slider"
            class="scale-slider"
            min="70"
            max="100"
            step="1"
            value="85"
          />
          <div class="scale-ticks">
            <span>70%</span>
            <span class="scale-tick-mid">默认</span>
            <span>100%</span>
          </div>
        </div>
      </div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">键鼠外观</span>
        <div class="kb-pills" id="desk-skin-pills"></div>
      </div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">键帽 DIY</span>
        <div class="kb-pills" id="keycap-diy-pills">
          <button class="kb-pill" data-diy="wasd">WASD 高亮</button>
          <button class="kb-pill" data-diy="numpad">数字区撞色</button>
          <button class="kb-pill" data-diy="esc">Esc 警示</button>
          <button class="kb-pill" data-diy="arrows">方向键</button>
          <button class="kb-pill" data-diy="emoji">表情键帽</button>
          <button class="kb-pill" id="btn-open-keycap-designer">🎨 打开设计器</button>
          <button class="kb-pill" data-diy="clear">清除 DIY</button>
        </div>
      </div>

      <div id="keycap-designer" class="keycap-designer hidden">
        <div class="kce-head">
          <span>🎨 键帽设计器</span>
          <button class="kce-close" id="kce-close" type="button">×</button>
        </div>
        <div class="kce-hint">点选下方任意按键，再挑颜色 / 图标</div>
        <div class="kce-grid" id="kce-grid"></div>
        <div class="kce-panel">
          <div class="kce-selected" id="kce-selected">未选择按键</div>
          <div class="kce-row">
            <span class="kce-label">顶面</span>
            <div class="light-swatches" id="kce-colors"></div>
          </div>
          <div class="kce-row">
            <span class="kce-label">图标</span>
            <div class="light-swatches" id="kce-emojis"></div>
          </div>
          <div class="kce-row">
            <input id="kce-label-input" class="kce-input" maxlength="4" placeholder="自定义文字（最多4字）" />
            <button class="kb-pill" id="kce-apply-label" type="button">应用文字</button>
          </div>
          <div class="kce-row">
            <button class="kb-pill" id="kce-reset-key" type="button">清除此键</button>
            <button class="kb-pill" id="kce-clear-all" type="button">清除全部</button>
            <button class="kb-pill kce-done" id="kce-done" type="button">完成</button>
          </div>
        </div>
      </div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">待机动作</span>
        <div class="kb-pills" id="idle-action-pills">
          <button class="kb-pill" data-idleaction="drink">🥤 喝一口</button>
          <button class="kb-pill" data-idleaction="stretch">🙆 伸懒腰</button>
          <button class="kb-pill" data-idleaction="wave">👋 挥手</button>
          <button class="kb-pill" data-idleaction="groom">👅 洗脸</button>
          <button class="kb-pill" data-idleaction="nap">😴 打盹</button>
          <button class="kb-pill" data-idleaction="cuddle">💗 撒娇</button>
        </div>
        <label class="menu-toggle-row">
          <span>空闲时随机待机</span>
          <input type="checkbox" id="idle-auto" checked />
        </label>
      </div>
      <div class="menu-scale-row">
        <div class="scale-header">
          <span class="menu-scale-label">小道具（互动饮品）</span>
          <button class="scale-value-btn" id="prop-toggle-btn" type="button">关闭</button>
        </div>
        <div class="kb-pills" id="prop-kind-pills"></div>
        <div class="kb-pills" id="prop-side-pills"></div>
        <label class="menu-toggle-row">
          <span>猫猫空闲时自动喝</span>
          <input type="checkbox" id="prop-auto-sip" checked />
        </label>
      </div>
      <div class="menu-scale-row">
        <span class="menu-scale-label">键盘灯光</span>
        <div class="kb-pills" id="light-effect-pills">
          <button class="kb-pill" data-lightfx="off">关闭</button>
          <button class="kb-pill" data-lightfx="static">常亮</button>
          <button class="kb-pill" data-lightfx="breath">呼吸</button>
          <button class="kb-pill" data-lightfx="rainbow">彩虹</button>
          <button class="kb-pill" data-lightfx="wave">波浪</button>
          <button class="kb-pill" data-lightfx="ripple">涟漪</button>
          <button class="kb-pill" data-lightfx="typing">打字余晖</button>
          <button class="kb-pill" data-lightfx="aurora">极光</button>
        </div>
        <div class="light-swatches" id="light-swatches"></div>
        <div class="kb-pills" id="light-color-mode-pills"></div>
        <div class="light-swatches" id="light-palette-swatches"></div>
        <div class="kb-pills" id="light-edge-pills">
          <button class="kb-pill" data-edgelight="on">边缘灯带 · 开</button>
          <button class="kb-pill active" data-edgelight="off">边缘灯带 · 关</button>
        </div>
        <div class="scale-header light-brightness-row">
          <span class="menu-scale-label">亮度</span>
          <span class="menu-hint" id="light-brightness-value">75%</span>
        </div>
        <div class="scale-slider-wrap">
          <input
            type="range"
            id="light-brightness"
            class="scale-slider"
            min="10"
            max="100"
            step="5"
            value="75"
          />
        </div>
        <div class="scale-header light-brightness-row">
          <span class="menu-scale-label">流动速度</span>
          <span class="menu-hint" id="light-speed-value">1.0×</span>
        </div>
        <div class="scale-slider-wrap">
          <input
            type="range"
            id="light-speed"
            class="scale-slider"
            min="20"
            max="300"
            step="10"
            value="100"
          />
        </div>
      </div>
      <div class="menu-scale-row">
        <div class="scale-header">
          <span class="menu-scale-label">尺寸缩放</span>
          <button class="scale-value-btn" id="scale-value" type="button" title="点击复位 100%">100%</button>
        </div>
        <div class="scale-slider-wrap">
          <input
            type="range"
            id="scale-slider"
            class="scale-slider"
            min="20"
            max="150"
            step="1"
            value="100"
          />
          <div class="scale-ticks">
            <span>20%</span>
            <span class="scale-tick-mid">100%</span>
            <span>150%</span>
          </div>
        </div>
      </div>
      </div><!-- /system -->
      </div><!-- /tab-body -->
      <div class="menu-sep"></div>
      <div class="menu-footer-bar">
      <button class="menu-item" data-action="desktop-shortcut" id="btn-desktop-shortcut">
        <span>创建桌面图标</span>
        <span class="menu-hint" id="shortcut-hint">KuroCat</span>
      </button>
      <button class="menu-item" data-action="reset-pos">
        <span>重置位置到右下角</span>
      </button>
      <button class="menu-item" data-action="check-update" id="btn-check-update">
        <span>检查更新</span>
        <span class="menu-hint" id="update-hint">v4.8.0</span>
      </button>
      <button class="menu-item danger" data-action="quit">
        <span>退出 KuroCat</span>
      </button>
      </div><!-- /menu-footer-bar -->
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
