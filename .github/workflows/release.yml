name: Build Cross-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Only build Windows (x64 installer + portable zip)'
        type: boolean
        default: false
      linux_only:
        description: 'Only build Linux (x86_64 + ARM64) packages'
        type: boolean
        default: false
      macos_only:
        description: 'Only build macOS Universal (10.15+) packages'
        type: boolean
        default: false
      android_only:
        description: 'Only build Android signed APK (2D overlay, Android 8+)'
        type: boolean
        default: false
      legacy_only:
        description: 'Only build experimental Windows 7/8.1 x64 portable'
        type: boolean
        default: false
      release_tag:
        description: 'Optional tag label for artifact naming (e.g. v1.0.0)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies on GitHub runner
        run: npm ci
      - name: Check TypeScript without emitting files
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Check pet motions and model packages
        run: node scripts/check-pet-motion.mjs
      - name: Check model library behavior
        run: node scripts/check-model-library.mjs
      - name: Check GLB import and package validation
        run: node scripts/check-glb-import.mjs
      - name: Check GLB motion transitions
        run: node scripts/check-glb-motion.mjs
      - name: Check keyboard and mouse resources
        run: node scripts/check-resource-library.mjs
      - name: Check public model catalog
        run: node scripts/build-model-catalog.mjs --check

  build-windows:
    needs: validate-frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.linux_only || inputs.macos_only || inputs.android_only || inputs.legacy_only)) }}
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Windows Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri app (Windows x64 - 65% Classic Installer)
        run: npm run tauri -- build --bundles nsis

      - name: Rename Windows installer asset
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG }
                 elseif ($env:GITHUB_REF_NAME -match '^v') { $env:GITHUB_REF_NAME }
                 else { 'v' + (Get-Content package.json -Raw | ConvertFrom-Json).version }
          $ver = $tag.TrimStart('v')

          $nsis = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($nsis) {
            Copy-Item $nsis.FullName "DIY-Cat-$ver-x64-setup.exe"
            Write-Host "Installer: DIY-Cat-$ver-x64-setup.exe"
          } else {
            Write-Warning "NSIS installer not found"
          }

          # Portable build: tauri already embeds the frontend into this exe.
          $exe = "src-tauri/target/release/DIY-Cat.exe"
          if (Test-Path $exe) {
            Copy-Item $exe "DIY-Cat-$ver-windows-x64.exe" -Force
            Compress-Archive -Path "DIY-Cat-$ver-windows-x64.exe" -DestinationPath "DIY-Cat-$ver-x64-portable.zip" -Force
            Write-Host "Portable: DIY-Cat-$ver-x64-portable.zip"
          } else {
            Write-Warning "Portable exe not found at $exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diy-cat-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            DIY-Cat-*-x64-setup.exe
            DIY-Cat-*-x64-portable.zip
            DIY-Cat-*-windows-x64.exe

      - name: Publish Windows assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            DIY-Cat-*-x64-setup.exe
            DIY-Cat-*-x64-portable.zip
            DIY-Cat-*-windows-x64.exe

  build-macos:
    needs: validate-frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.linux_only || inputs.windows_only || inputs.android_only || inputs.legacy_only)) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable (Apple Silicon + Intel Universal)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri Universal macOS .app
        run: npm run tauri -- build --target universal-apple-darwin --bundles app

      - name: Package Universal macOS .dmg and .app.tar.gz
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          APP_PATH="src-tauri/target/universal-apple-darwin/release/bundle/macos/DIY-Cat.app"
          test -d "$APP_PATH"
          echo "=== Verify macOS minimum version & Universal slices ==="
          plutil -p "$APP_PATH/Contents/Info.plist" | grep -i MinimumSystemVersion || true
          lipo -info "$APP_PATH/Contents/MacOS/DIY-Cat"
          otool -arch x86_64 -l "$APP_PATH/Contents/MacOS/DIY-Cat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          otool -arch arm64 -l "$APP_PATH/Contents/MacOS/DIY-Cat" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true
          mkdir -p dmg_staging
          cp -R "$APP_PATH" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "DIY-Cat" -srcfolder dmg_staging -ov -format UDZO "DIY-Cat-${TAG}-macos-universal.dmg"
          tar -czf "DIY-Cat-${TAG}-macos-universal.app.tar.gz" -C "src-tauri/target/universal-apple-darwin/release/bundle/macos" "DIY-Cat.app"
          ls -lh "DIY-Cat-${TAG}-macos-universal.dmg" "DIY-Cat-${TAG}-macos-universal.app.tar.gz"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diy-cat-macos-universal
          retention-days: 14
          path: |
            DIY-Cat-*-macos-universal.dmg
            DIY-Cat-*-macos-universal.app.tar.gz

      - name: Publish macOS assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            DIY-Cat-*-macos-universal.dmg
            DIY-Cat-*-macos-universal.app.tar.gz

  build-linux:
    needs: validate-frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.macos_only || inputs.windows_only || inputs.android_only || inputs.legacy_only)) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run Linux Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Linux .deb (KylinOS / Ubuntu / Debian / UOS)
        run: npm run tauri -- build --bundles deb

      - name: Build Tauri Linux .AppImage (best-effort)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: |
          npm run tauri -- build --bundles appimage || echo "AppImage bundle skipped on ${{ matrix.arch }}"

      - name: Smoke-test Linux binary and inspect ELF / .deb metadata
        run: |
          BIN="src-tauri/target/release/DIY-Cat"
          test -x "$BIN"
          echo "=== Dynamic libraries ==="
          ldd "$BIN"
          echo "=== Max GLIBC symbols required ==="
          objdump -T "$BIN" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu | tail -n 10
          echo "=== MCP stdio live smoke test ==="
          RESP=$(printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}\n' | "$BIN" --mcp)
          echo "$RESP"
          echo "$RESP" | grep -q '"name":"kurocat"'
          echo "=== DEB metadata ==="
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          dpkg-deb -I "$DEB"

      - name: Rename Linux packages
        shell: bash
        run: |
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            if [[ "${GITHUB_REF_NAME}" =~ ^v ]]; then
              TAG="${GITHUB_REF_NAME}"
            else
              TAG="v$(node -p "require('./package.json').version")"
            fi
          fi
          ARCH="${{ matrix.arch }}"
          DEB=$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)
          cp "$DEB" "DIY-Cat-${TAG}-linux-${ARCH}.deb"
          APPIMG=$(ls src-tauri/target/release/bundle/appimage/*.AppImage 2>/dev/null | head -n 1 || true)
          if [[ -n "$APPIMG" && -f "$APPIMG" ]]; then
            cp "$APPIMG" "DIY-Cat-${TAG}-linux-${ARCH}.AppImage"
          fi
          ls -lh DIY-Cat-${TAG}-linux-${ARCH}.*

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: diy-cat-linux-${{ matrix.arch }}
          retention-days: 14
          path: |
            DIY-Cat-*-linux-${{ matrix.arch }}.deb
            DIY-Cat-*-linux-${{ matrix.arch }}.AppImage

      - name: Publish Linux assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            DIY-Cat-*-linux-${{ matrix.arch }}.deb
            DIY-Cat-*-linux-${{ matrix.arch }}.AppImage

  build-android:
    needs: validate-frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows_only || inputs.linux_only || inputs.macos_only || inputs.legacy_only)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build web assets on GitHub runner
        run: |
          npm ci
          npm run build:android-web
      - name: Restore persistent signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/diy-cat-release.p12"
      - name: Build signed APK and run Android lint
        working-directory: android
        env:
          KUROCAT_ANDROID_KEYSTORE: ${{ runner.temp }}/diy-cat-release.p12
          KUROCAT_ANDROID_STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KUROCAT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUROCAT_ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --max-workers=2 :app:assembleRelease :app:lintRelease
      - name: Verify signature and name APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION=$(node -p "require('./package.json').version")
          cp "$APK" "DIY-Cat-$VERSION-android.apk"
          sha256sum "DIY-Cat-$VERSION-android.apk" > "DIY-Cat-$VERSION-android.apk.sha256"
      - name: Remove runner signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/diy-cat-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: diy-cat-android
          if-no-files-found: error
          retention-days: 14
          path: |
            DIY-Cat-*-android.apk
            DIY-Cat-*-android.apk.sha256
      - name: Upload Android checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diy-cat-android-checks
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore
      - name: Publish signed Android APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            DIY-Cat-*-android.apk
            DIY-Cat-*-android.apk.sha256

  build-windows-legacy:
    needs: validate-frontend
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows_only || inputs.linux_only || inputs.macos_only || inputs.android_only)) }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: win7-build-std
      - name: Build embedded frontend
        run: |
          npm ci
          npm run build
      - name: Build with the Windows 7 Rust target and its standard library
        run: cargo +nightly build --manifest-path src-tauri/Cargo.toml --release --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort --features win7
      - name: Package experimental legacy binary
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'diy-cat-win7'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath 'src-tauri/target/x86_64-win7-windows-msvc/release/DIY-Cat.exe' -Destination (Join-Path $stage 'DIY-Cat.exe')
          Copy-Item -LiteralPath 'docs/LEGACY_WINDOWS.md' -Destination (Join-Path $stage 'README.md')
          Compress-Archive -Path "$stage/*" -DestinationPath "DIY-Cat-$ver-win7-x64-experimental.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: diy-cat-windows-legacy-experimental
          if-no-files-found: error
          retention-days: 14
          path: DIY-Cat-*-win7-x64-experimental.zip
      - name: Publish experimental legacy package
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: DIY-Cat-*-win7-x64-experimental.zip
