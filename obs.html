<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DIY-Cat OBS Browser Source</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent !important;
      }
      #obs-canvas,
      #obs-canvas-3d {
        display: block;
        width: 100vw;
        height: 100vh;
        background: transparent !important;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <canvas id="obs-canvas" aria-label="DIY-Cat OBS Transparent Source"></canvas>
    <canvas id="obs-canvas-3d" class="hidden" aria-label="DIY-Cat OBS 3D Transparent Source"></canvas>
    <script type="module" src="/src/obsMain.ts"></script>
  </body>
</html>
